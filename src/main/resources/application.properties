# Core ERP - Quarkus Application Configuration
quarkus.application.name=core-erp

# HTTP Server
quarkus.http.port=8080

# Dev Services (auto-starts database in dev/test mode)
%dev.quarkus.hibernate-orm.database.generation=embed-database
%test.quarkus.hibernate-orm.database.generation=create-test-database

# Database - Production config only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/core_erp
%prod.quarkus.datasource.username=admin
%prod.quarkus.datasource.password=admin123
%prod.quarkus.hibernate-orm.database.generation=validate

# Hibernate ORM
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.jdbc.batch.size=20
quarkus.hibernate-orm.jdbc.fetch-size=100

# File Upload Configuration
quarkus.http.auth.allow-cors=true
quarkus.smallrye-stork.enabled=false

# Vaadin Integration
quarkus.dev.services.auto-restart=false
