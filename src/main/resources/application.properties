# Make sure the application domain is prefixed with 'https://'
quarkus.oidc.auth-server-url=${AUTH0_ISSUER}
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=${AUTH0_CLIENT_ID}
quarkus.oidc.credentials.secret=${AUTH0_CLIENT_SECRET}
quarkus.live-reload.instrumentation=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=erp
quarkus.datasource.password=erp
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/erp
quarkus.datasource.jdbc.max-size=10
quarkus.oidc.authentication.scopes=openid,profile,email
quarkus.http.auth.permission.authenticated.paths=/logout,/q/dev-ui,/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.oidc.roles.role-claim-path="https://putracoderz.my.id/erp/roles"
quarkus.oidc.end-session-path=v2/logout
quarkus.oidc.logout.post-logout-uri-param=returnTo
quarkus.oidc.logout.extra-params.client_id=${quarkus.oidc.client-id}
quarkus.oidc.logout.path=/logout
# Where the browser is redirected after Auth0 completes the end-session.
# Quarkus resolves this relative path to an absolute URL and sends it as the
# 'returnTo' parameter (see quarkus.oidc.logout.post-logout-uri-param=returnTo).
# This URL must be listed in Auth0's "Allowed Logout URLs".
quarkus.oidc.logout.post-logout-uri=/login
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.jacoco.excludes=**/views/**,**/ui/**,**/config/**
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy