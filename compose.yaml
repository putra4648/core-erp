services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=core_erp'
      - 'POSTGRES_PASSWORD=admin123'
      - 'POSTGRES_USER=admin'
    ports:
      - 5432:5432
    volumes:
      - core_erp_db:/var/lib/postgresql
      - ./core-erp.session.sql:/docker-entrypoint-initdb.d/01-core-erp.session.sql:ro

volumes:
  core_erp_db: