name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: |
          ./mvnw -B clean verify \
            --no-transfer-progress \
            -Dquarkus.http.host=0.0.0.0 \
            -Dmaven.compiler.release=25

  native-build:
    name: Native build
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1.6.6
        with:
          distribution: mandrel
          java-version: '25'
          cache: maven
          #native-image-job-reports: 'true'
          #native-image-pr-reports: 'true'

      - name: Build native image
        run: |
          - name: Build native image
        run: |
          ./mvnw -B clean verify -Dnative \
            --no-transfer-progress \
            -Dquarkus.http.host=0.0.0.0 \
            -Dmaven.compiler.release=25 \
            -Dquarkus.native.additional-build-args="--enable-monitoring=heapdump"
