name: Spring Boot Native CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------
  # 1. PR / FAST FEEDBACK (Cepat: Hanya Build JAR & Test)
  # ----------------------------------------------------
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven # Caching otomatis bawaan setup-java

      - name: Fast Test & Package (Standard JVM)
        run: mvn clean test package -DskipNativeBuild

  # ----------------------------------------------------
  # 2. MAIN BRANCH BUILD (Native Image Compilation)
  # ----------------------------------------------------
  build-native:
    # Hanya jalan saat push ke main (Merge PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven' # Menggantikan actions/cache manual

      - name: Build Native Executable
        # Membatasi MAVEN_OPTS agar RAM runner tidak kepenuhan/swapping
        env:
          MAVEN_OPTS: "-Xmx6g"
        # Menambahkan parameter pembatas thread & opsi kompilasi
        run: |
          mvn -Pnative native:compile \
            -Dspring-boot.build-image.opt-level=0 \
            -Dnative.buildArgs="-H:NumberOfThreads=2"

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-binary
          path: target/* # Ubah jika nama binary spesifik (misal: target/app)

  # ----------------------------------------------------
  # 3. PACKAGE & PUSH DOCKER IMAGE
  # ----------------------------------------------------
  docker-build:
    needs: build-native
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Native Binary
        uses: actions/download-artifact@v4
        with:
          name: native-binary
          path: target/

      # Memastikan file binary memiliki hak akses eksekusi sebelum di-pack ke Docker
      - name: Make binary executable
        run: chmod +x target/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Menambahkan cache layer docker agar pendorongan image lebih cepat
          cache-from: type=gha
          cache-to: type=gha,mode=max
